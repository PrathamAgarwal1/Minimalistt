name: Build debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Builds publish one after another so the newest push always ends up on the release.
concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Check the APK has no INTERNET permission
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests android.permission.INTERNET"
            exit 1
          fi

      - name: Check the release APK has no debug reset
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          RELEASE_APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$RELEASE_APK" > release-manifest.txt
          if grep -q "DEBUG_RESET\|DebugResetReceiver" release-manifest.txt; then
            echo "::error::The release APK contains the debug reset receiver"
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk | grep -q "DEBUG_RESET" \
            || { echo "::error::The debug APK is missing the debug reset receiver"; exit 1; }

      # Room writes a schema file per database version; later migrations are tested against them.
      - name: Commit the Room schema if it changed
        if: github.event_name == 'push'
        run: |
          git add app/schemas
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Room schema"
            # Newer commits may have landed while this built; put the schema on top of them.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: launcher-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # A plain .apk on a fixed release, so the phone can download it with one tap:
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/quiet-debug.apk
      - name: Publish to the latest-debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk quiet-debug.apk
          cp app/build/outputs/apk/release/app-release.apk quiet.apk
          notes="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). quiet.apk is for everyday use; quiet-debug.apk has test mode and the adb reset."
          git tag -f latest-debug
          git push -f origin refs/tags/latest-debug
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release upload latest-debug quiet-debug.apk quiet.apk --clobber
            gh release edit latest-debug --notes "$notes"
            # The files from before the app was renamed.
            gh release delete-asset latest-debug minimalist.apk --yes || true
            gh release delete-asset latest-debug minimalist-debug.apk --yes || true
          else
            gh release create latest-debug quiet-debug.apk quiet.apk --title "Latest build" --notes "$notes"
          fi

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
