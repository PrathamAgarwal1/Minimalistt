name: Build debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Builds publish one after another so the newest push always ends up on the release.
concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Check the APK has no INTERNET permission
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The APK requests android.permission.INTERNET"
            exit 1
          fi

      - name: Check the release APK has no debug reset
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          RELEASE_APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$RELEASE_APK" > release-manifest.txt
          if grep -q "DEBUG_RESET\|DebugResetReceiver" release-manifest.txt; then
            echo "::error::The release APK contains the debug reset receiver"
            exit 1
          fi
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/debug/app-debug.apk | grep -q "DEBUG_RESET" \
            || { echo "::error::The debug APK is missing the debug reset receiver"; exit 1; }

      - name: Check the Room schema is committed
        run: |
          untracked="$(git ls-files --others --exclude-standard app/schemas)"
          if [ -n "$untracked" ] || ! git diff --quiet --ignore-all-space -- app/schemas; then
            git diff --ignore-all-space -- app/schemas
            for f in $untracked; do echo "== $f"; cat "$f"; done
            echo "::error::Room schema changed; commit the files under app/schemas"
            exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A plain .apk on a fixed release, so the phone can download it with one tap:
      # https://github.com/<owner>/<repo>/releases/download/latest-debug/minimalist-debug.apk
      - name: Publish to the latest-debug release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk minimalist-debug.apk
          notes="Build ${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Tap minimalist-debug.apk to download."
          git tag -f latest-debug
          git push -f origin refs/tags/latest-debug
          if gh release view latest-debug > /dev/null 2>&1; then
            gh release upload latest-debug minimalist-debug.apk --clobber
            gh release edit latest-debug --notes "$notes"
          else
            gh release create latest-debug minimalist-debug.apk --title "Latest debug build" --notes "$notes"
          fi

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
